# Test configuration: run without config-server, Eureka and PostgreSQL
spring:
  application:
    name: students
  cloud:
    config:
      enabled: false
  datasource:
    url: jdbc:h2:mem:students;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop

eureka:
  client:
    enabled: false
