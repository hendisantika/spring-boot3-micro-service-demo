version: 2
updates:
  # Maven dependencies for every micro service
  - package-ecosystem: maven
    directories:
      - "/config-server"
      - "/department"
      - "/discovery"
      - "/employee"
      - "/gateway"
      - "/organization"
      - "/school"
      - "/student"
    schedule:
      interval: daily
      time: "05:00"
      timezone: Asia/Jakarta
    open-pull-requests-limit: 20
    labels:
      - dependencies
      - java
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
      include: scope
    groups:
      spring-boot:
        patterns:
          - "org.springframework.boot*"
      spring-cloud:
        patterns:
          - "org.springframework.cloud*"
      springdoc:
        patterns:
          - "org.springdoc*"
      observability:
        patterns:
          - "io.micrometer*"
          - "io.zipkin*"
      maven-plugins:
        patterns:
          - "org.apache.maven*"
      minor-and-patch:
        update-types:
          - minor
          - patch
        exclude-patterns:
          - "org.springframework.boot*"
          - "org.springframework.cloud*"
          - "org.springdoc*"
          - "io.micrometer*"
          - "io.zipkin*"
          - "org.apache.maven*"

  # GitHub Actions used in workflows
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: daily
      time: "05:00"
      timezone: Asia/Jakarta
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - github_actions
    commit-message:
      prefix: "ci(deps)"
      include: scope
    groups:
      github-actions:
        patterns:
          - "*"
